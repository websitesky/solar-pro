<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="LiFePO4 акумулятор">
  <defs>
    <linearGradient id="batBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e9f3"/>
    </linearGradient>
    <linearGradient id="batGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2979ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#2979ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="320" height="260" fill="url(#batGlow)"/>
  <ellipse cx="160" cy="234" rx="90" ry="10" fill="#1a237e" opacity=".12"/>

  <!-- stacked modules -->
  <g stroke="#c3ccdd" stroke-width="2">
    <rect x="86" y="176" width="148" height="52" rx="10" fill="url(#batBody)"/>
    <rect x="86" y="120" width="148" height="52" rx="10" fill="url(#batBody)"/>
    <rect x="86" y="64" width="148" height="52" rx="10" fill="url(#batBody)"/>
  </g>

  <!-- top control module -->
  <rect x="86" y="26" width="148" height="34" rx="9" fill="#1a237e"/>
  <rect x="98" y="36" width="46" height="14" rx="4" fill="#ffffff" opacity=".9"/>
  <g fill="#8ec5ff">
    <circle cx="196" cy="43" r="5"/>
    <circle cx="214" cy="43" r="5"/>
  </g>

  <!-- charge level indicators -->
  <g>
    <rect x="100" y="86" width="88" height="8" rx="4" fill="#dfe6f1"/>
    <rect x="100" y="86" width="76" height="8" rx="4" fill="#2979ff"/>
    <rect x="100" y="142" width="88" height="8" rx="4" fill="#dfe6f1"/>
    <rect x="100" y="142" width="62" height="8" rx="4" fill="#2979ff"/>
    <rect x="100" y="198" width="88" height="8" rx="4" fill="#dfe6f1"/>
    <rect x="100" y="198" width="70" height="8" rx="4" fill="#2979ff"/>
  </g>

  <!-- lightning badge -->
  <circle cx="209" cy="90" r="13" fill="#1a237e"/>
  <path d="M211 82l-7 10h5l-2 8 7-10h-5z" fill="#ffd24d"/>

  <g fill="#c3ccdd">
    <rect x="200" y="140" width="18" height="12" rx="3"/>
    <rect x="200" y="196" width="18" height="12" rx="3"/>
  </g>
</svg>
